<ion-content [fullscreen]="true">
  <div class="header-gradient">
    <button class="admin-logout" type="button" (click)="logout()" aria-label="Logout">
      <ion-icon name="log-out-outline"></ion-icon>
      <span>Logout</span>
    </button>
    <div class="user-profile">
      <div class="avatar">{{ user.initiales }}</div>
      <div class="user-info">
        <h2>{{ user.nom }}</h2>
        <div class="badge-row">
          <span class="level-badge">⚡ {{ user.niveau }}</span>
          <span class="user-email">{{ user.email }}</span>
        </div>
      </div>
    </div>

    
  </div>

  <div class="main-content">
    <div class="custom-tabs">
      <div class="tab active">📊 Aperçu</div>
      <button class="tab" type="button" (click)="router.navigate(['/admin/questions-quiz'])">❓ Questions quiz</button>
    </div>

    <div class="section-header">
      <span class="icon-bg">📊</span>
      <h3>Statistiques globales</h3>
    </div>

    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="6" *ngFor="let stat of stats">
          <div class="stat-card">
            <div class="card-icon" [ngClass]="stat.color">{{ stat.icon }}</div>
            <div class="card-value">{{ stat.value }}</div>
            <div class="card-label">{{ stat.label }}</div>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

  <div class="actions">
    <ion-button color="secondary" (click)="markTestAccountAsNew()" expand="block">
      Reset "Nouveau" (test@gmail.com)
      <span class="debug-tag">débug</span>
    </ion-button>

    <ion-button color="danger" (click)="resetTestAccountHistory()" expand="block">
      Reset Historique (test@gmail.com)
      <span class="debug-tag">débug</span>
    </ion-button>
  </div>

  </div>
</ion-content>
