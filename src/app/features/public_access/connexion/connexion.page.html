<ion-content class="login-content" [fullscreen]="true">
  <div class="login-page">
    <div class="login-card">
      <button class="back-button" type="button" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Retour</span>
      </button>

      <section class="header-section">
        <div class="profile-icon">
          <ion-icon name="person-outline"></ion-icon>
        </div>

        <h1>
          <ng-container *ngIf="role === 'student'">Connexion</ng-container>
          <ng-container *ngIf="role === 'parent'">Connexion</ng-container>
          <ng-container *ngIf="!role">Connexion</ng-container>
        </h1>
        <p class="subtitle">Connectez-vous a votre compte <strong>SkillNest</strong></p>
      </section>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="separator"></div>

        <div class="input-group">
          <label for="login-email">Email</label>
          <ion-item lines="none" class="custom-input">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-input
              id="login-email"
              type="email"
              placeholder="votre@email.com"
              [(ngModel)]="email"
              name="email"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <label for="login-password">Mot de passe</label>
          <ion-item lines="none" class="custom-input">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input
              id="login-password"
              type="password"
              placeholder="........"
              [(ngModel)]="password"
              name="password"
              required>
            </ion-input>
            <ion-icon name="eye-outline" slot="end"></ion-icon>
          </ion-item>
        </div>

        <div class="options">
          <label class="remember-me">
            <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe"></ion-checkbox>
            <span>Se souvenir de moi</span>
          </label>
          <button class="forgot-link" type="button" (click)="goToForgot()">Mot de passe oublie ?</button>
        </div>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="!loginForm.form.valid"
          class="login-button">
          <span>Se connecter</span>
          <span class="button-icon">
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </span>
        </ion-button>
      </form>

      <p class="signup">
        Pas encore de compte ? <button type="button" (click)="goToRegister()">S'inscrire</button>
      </p>

      <div class="secure-badge">
        <ion-icon name="sparkles-outline"></ion-icon>
        <span>Connexion securisee SkillNest</span>
      </div>
    </div>
  </div>
</ion-content>
