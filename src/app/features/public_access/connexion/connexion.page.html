<ion-content [fullscreen]="true">
  <div class="login-wrapper">

    <div class="header-section">
      <h1>
        <ng-container *ngIf="role === 'student'">Connexion Étudiant</ng-container>
        <ng-container *ngIf="role === 'parent'">Connexion Parent</ng-container>
        <ng-container *ngIf="!role">Connexion</ng-container>
      </h1>
      <p class="subtitle">Connectez-vous à votre compte SkillNest</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div class="input-group">
        <label>Email</label>
        <ion-item lines="none" class="custom-input">
          <ion-input
            type="email"
            placeholder="Email"
            [(ngModel)]="email"
            name="email"
            required>
          </ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Mot de passe</label>
        <ion-item lines="none" class="custom-input">
          <ion-input
            type="password"
            placeholder="Mot de passe"
            [(ngModel)]="password"
            name="password"
            required>
          </ion-input>
        </ion-item>
      </div>

      <div class="options">
        <div class="remember-me">
          <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe"></ion-checkbox>
          <ion-label>Se souvenir de moi</ion-label>
        </div>
        <a (click)="goToForgot()">Mot de passe oublié ?</a>
      </div>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="!loginForm.form.valid"
        class="login-button">
        Se connecter
      </ion-button>

    </form>

    <p class="signup">
      Pas encore de compte ?
      <a (click)="goToRegister()">S'inscrire</a>
    </p>

  </div>
</ion-content>
