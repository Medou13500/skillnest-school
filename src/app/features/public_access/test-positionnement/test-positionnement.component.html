<ion-content class="bg-cream">
  <!-- Section Bleue (Header) -->
  <div class="header-blue">
    <div class="header-top-row">
      <div class="header-content">
        <div class="icon-square">
          <img src="assets/icon/target.png" alt="target" />
        </div>
        <div class="text-group">
          <h1>Test de positionnement</h1>
          <p>Évalue ton niveau en quelques minutes</p>
        </div>
      </div>

      <button class="admin-logout" type="button" (click)="logout()" aria-label="Logout">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <div class="main-container">
    <!-- Cards Stats (10 Questions / 5 min / 5 Niveaux) -->
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="4">
          <div class="stat-card">
            <span class="emoji">❓</span>
            <span class="val">{{ isLoading ? '...' : questionCount }}</span>
            <span class="lab">Questions</span>
          </div>
        </ion-col>
        <ion-col size="4">
          <div class="stat-card">
            <span class="emoji">⏱️</span>
            <span class="val">~30 min</span>
            <span class="lab">Durée</span>
          </div>
        </ion-col>
        <ion-col size="4">
          <div class="stat-card">
            <span class="emoji">📚</span>
            <span class="val">{{ isLoading ? '...' : subjectCount }}</span>
            <span class="lab">Matières</span>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- Bouton Démarrer -->
    <ion-button expand="block" class="btn-start" routerLink="/quiz-test-positionnement">
      Démarrer le test
      <ion-icon slot="end" name="arrow-forward-circle"></ion-icon>
    </ion-button>

    <p class="footer-text">
      Tu pourras refaire le test à tout moment depuis ton profil.
    </p>
  </div>
</ion-content>
