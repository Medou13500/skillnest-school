<ion-content class="signup-content" [fullscreen]="true">
  <div class="signup-page">
    <div class="signup-card">
      <button class="back-button" type="button" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Retour</span>
      </button>

      <section class="header-section">
        <div class="profile-icon">
          <ion-icon name="person-add-outline"></ion-icon>
        </div>

        <h1 class="page-title">Creer un compte</h1>
      <p class="page-subtitle">
        Rejoignez <strong>SkillNest School</strong> et commencez a apprendre
      </p>

      <div class="role-selector">
        <button type="button" class="role-pill" [class.active]="role === 'student'" (click)="role = 'student'">
          Etudiant
        </button>
        <button type="button" class="role-pill" [class.active]="role === 'parent'" (click)="role = 'parent'">
          Parent
        </button>
      </div>
      </section>

      <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
        <div class="name-row">
          <div class="input-group">
            <label for="prenom">Prenom</label>
            <ion-item lines="none" class="custom-input">
              <ion-input
                id="prenom"
                type="text"
                name="prenom"
                placeholder="Votre prenom"
                [(ngModel)]="prenom"
                required>
              </ion-input>
            </ion-item>
          </div>

          <div class="input-group">
            <label for="nom">Nom</label>
            <ion-item lines="none" class="custom-input">
              <ion-input
                id="nom"
                type="text"
                name="nom"
                placeholder="Votre nom"
                [(ngModel)]="nom"
                required>
              </ion-input>
            </ion-item>
          </div>
        </div>

        <div class="input-group">
          <label for="username">Nom d'utilisateur</label>
          <ion-item lines="none" class="custom-input">
            <ion-input
              id="username"
              type="text"
              name="username"
              placeholder="@nom_utilisateur"
              [(ngModel)]="username"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <ion-item lines="none" class="custom-input">
            <ion-input
              id="email"
              type="email"
              name="email"
              placeholder="votre@email.com"
              [(ngModel)]="email"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group" *ngIf="role === 'student'">
          <label for="classe">Classe</label>
          <ion-item lines="none" class="custom-input select-input">
            <ion-select
              id="classe"
              name="classe"
              [(ngModel)]="classe"
              placeholder="Selectionnez votre classe"
              toggleIcon="caret-down-outline"
              interface="action-sheet"
              required>
              <ion-select-option value="classe1">Classe 1</ion-select-option>
              <ion-select-option value="classe2">Classe 2</ion-select-option>
              <ion-select-option value="classe3">Classe 3</ion-select-option>
            </ion-select>
          </ion-item>
        </div>

        <div class="input-group" *ngIf="role === 'parent'">
          <label for="studentEmail">Email de l'élève</label>
          <ion-item lines="none" class="custom-input">
            <ion-input
              id="studentEmail"
              type="email"
              name="studentEmail"
              placeholder="email@eleve.fr"
              [(ngModel)]="studentEmail"
              required>
            </ion-input>
          </ion-item>
          <p class="hint-text">L'élève doit déjà être inscrit avec cet email.</p>
        </div>

        <div class="input-group">
          <label for="password">Mot de passe</label>
          <ion-item lines="none" class="custom-input">
            <ion-input
              id="password"
              [type]="passwordVisible ? 'text' : 'password'"
              name="password"
              placeholder="........."
              [(ngModel)]="password"
              required>
            </ion-input>
            <button type="button" class="password-toggle" slot="end" (click)="togglePasswordVisibility()">
              <ion-icon [name]="passwordVisible ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </ion-item>
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirmer le mot de passe</label>
          <ion-item lines="none" class="custom-input">
            <ion-input
              id="confirm-password"
              [type]="confirmPasswordVisible ? 'text' : 'password'"
              name="confirmPassword"
              placeholder="........."
              [(ngModel)]="confirmPassword"
              required>
            </ion-input>
            <button type="button" class="password-toggle" slot="end" (click)="toggleConfirmPasswordVisibility()">
              <ion-icon [name]="confirmPasswordVisible ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </ion-item>
        </div>

        <div class="conditions">
          <label class="checkbox-item">
            <ion-checkbox name="acceptTerms" [(ngModel)]="acceptTerms" required></ion-checkbox>
            <span>J'accepte les <strong>conditions generales d'utilisation</strong></span>
          </label>

          <label class="checkbox-item">
            <ion-checkbox name="acceptPrivacy" [(ngModel)]="acceptPrivacy" required></ion-checkbox>
            <span>J'accepte la <strong>politique de confidentialite</strong></span>
          </label>
        </div>

        <ion-button
          expand="block"
          type="submit"
          class="submit-button"
          [disabled]="isSubmitting || !signupForm.form.valid || password !== confirmPassword || !acceptTerms || !acceptPrivacy">
          <span>Creer mon compte</span>
          <span class="button-icon">
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </span>
        </ion-button>

        <p class="footer-link">
          Deja un compte ? <button type="button" (click)="goToLogin()">Se connecter</button>
        </p>

        <div class="secure-badge">
          <ion-icon name="sparkles-outline"></ion-icon>
          <span>Inscription sécurisée SkillNest</span>
        </div>
      </form>
    </div>
  </div>
</ion-content>
