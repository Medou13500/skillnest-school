<ion-content class="reset-password-content" [fullscreen]="true">
  <div class="reset-password-page">
    <div class="reset-password-card">
      <section class="hero-section">
        <div class="hero-icon">
          <ion-icon name="key-outline"></ion-icon>
        </div>

        <h1 class="reset-title">Nouveau mot de passe</h1>
        <p class="reset-subtitle">
          Definis un nouveau mot de passe pour securiser ton compte.
        </p>
      </section>

      <section class="form-section">
        <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
          <div class="field-group">
            <label for="new-password">Nouveau mot de passe</label>
            <ion-item lines="none" class="input-item">
              <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
              <ion-input
                id="new-password"
                class="text-input"
                type="password"
                name="newPassword"
                placeholder="Saisir votre nouveau mot de passe"
                [(ngModel)]="newPassword"
                required>
              </ion-input>
            </ion-item>
          </div>

          <div class="field-group">
            <label for="confirm-password">Confirmation</label>
            <ion-item lines="none" class="input-item">
              <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
              <ion-input
                id="confirm-password"
                class="text-input"
                type="password"
                name="confirmPassword"
                placeholder="Confirmer le nouveau mot de passe"
                [(ngModel)]="confirmPassword"
                required>
              </ion-input>
            </ion-item>
          </div>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="!resetForm.form.valid"
            class="submit-button">
            <span>Mettre a jour</span>
            <span class="button-icon">
              <ion-icon name="arrow-forward-outline"></ion-icon>
            </span>
          </ion-button>

          <button class="back-link" type="button" routerLink="/connexion">
            <ion-icon name="arrow-back-outline"></ion-icon>
            <span>Revenir a la page de connexion</span>
          </button>
        </form>
      </section>
    </div>
  </div>
</ion-content>
