<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Mon Historique</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="stats-overview">
    <div class="stat-box">
      <span class="value">12</span>
      <span class="label">Quiz terminés</span>
    </div>
    <div class="stat-box">
      <span class="value">85%</span>
      <span class="label">Moyenne</span>
    </div>
  </div>

  <div class="list-container">
    <h2 class="section-title">Activités récentes</h2>

    <ion-card class="quiz-card" *ngFor="let quiz of historique">
      <ion-card-content>
        <div class="card-header">
          <div class="info">
            <span class="category">{{ quiz.categorie }}</span>
            <h3>{{ quiz.titre }}</h3>
            <span class="date">{{ quiz.date | date:'dd/MM/yyyy' }}</span>
          </div>
          <div class="score-badge" [class.success]="quiz.status === 'reussi'">
            <span class="points">{{ quiz.score }}/{{ quiz.totalQuestions }}</span>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-bar">
            <div class="fill" [style.width.%]="(quiz.score / quiz.totalQuestions) * 100" [class.red]="quiz.status === 'echoue'"></div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
