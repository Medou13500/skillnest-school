<ion-content class="forgot-password-content" [fullscreen]="true">
  <div class="forgot-password-page">
    <div class="forgot-password-card">
      <section class="hero-section">
        <div class="hero-icon">
          <ion-icon name="key-outline"></ion-icon>
        </div>

        <h1 class="forgot-title">Mot de passe oublie ?</h1>
        <p class="forgot-subtitle">
          Entrez votre email pour recevoir un lien de reinitialisation
        </p>
      </section>

      <section class="form-section">
        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
          <div class="field-group">
            <label for="forgot-email">Email</label>
            <ion-item lines="none" class="email-item">
              <ion-icon name="mail-outline" slot="start"></ion-icon>
              <ion-input
                id="forgot-email"
                class="email-input"
                type="email"
                name="email"
                placeholder="votre@email.com"
                [(ngModel)]="email"
                required>
              </ion-input>
            </ion-item>
          </div>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="!forgotForm.form.valid"
            class="submit-button">
            <span>Envoyer le lien</span>
            <span class="button-icon">
              <ion-icon name="arrow-forward-outline"></ion-icon>
            </span>
          </ion-button>

          <button class="back-link" type="button" routerLink="/connexion">
            <ion-icon name="arrow-back-outline"></ion-icon>
            <span>Revenir a la page de connexion</span>
          </button>
        </form>
      </section>
    </div>
  </div>
</ion-content>
