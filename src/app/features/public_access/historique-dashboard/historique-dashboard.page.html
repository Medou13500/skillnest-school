<ion-content [fullscreen]="true">
  <div class="dashboard-wrapper">
    <!-- Header Section -->
    <header class="dashboard-header">
      <div class="header-content">
        <div class="user-block">
          <div class="back-nav" (click)="goBack()">
            <ion-icon name="arrow-back-outline"></ion-icon>
          </div>
          <div class="avatar">{{ user.initiales }}</div>
          <div class="user-text">
            <p class="greeting">Bonjour,</p>
            <h2>{{ user.nom }}</h2>
          </div>
        </div>
      </div>

    </header>

    <div class="main-body">
      <!-- Tabs Navigation -->
      <div class="custom-tabs" (click)="onTabClick($event)">
        <div class="tab" (click)="router.navigate(['/dashboard'])">Aperçu</div>
        <div class="tab" (click)="router.navigate(['/notions'])">Notions</div>
        <div class="tab active">Historique</div>
        <div class="tab">Badges</div>
      </div>

      <!-- Sessions List -->
      <section class="sessions-section">
        <div class="section-title space-between">
          <div class="flex-title">
            <ion-icon name="time-outline"></ion-icon>
            <h3>Toutes les sessions</h3>
          </div>
          <span class="count-tag">{{ sessions.length }} sessions</span>
        </div>

        <div class="sessions-list">
          <div class="session-card" *ngFor="let s of visibleSessions">
            <div class="session-icon-bg">{{ s.icon }}</div>
            <div class="session-info">
              <div class="session-row">
                <h4>{{ s.titre }}</h4>
                <span class="session-score" [class]="s.statusColor">{{ s.score }}/{{ s.total }}</span>
              </div>
              <p class="session-meta">
                {{ s.categorie }} • {{ s.date }}
                <span *ngIf="s.duree"> • {{ s.duree }}</span>
              </p>
              <div class="session-progress">
                <div class="progress-track">
                  <div class="progress-fill" [style.width.%]="s.pourcentage" [class]="s.statusColor"></div>
                </div>
                <span class="progress-text">{{ s.pourcentage }}%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Pagination Controls -->
        <div class="pagination-actions">
          <button class="action-btn main" (click)="showMore()" *ngIf="visibleCount < sessions.length">
            <ion-icon name="add-circle-outline"></ion-icon>
            Afficher plus de sessions
          </button>
          <button class="action-btn secondary" (click)="showLess()" *ngIf="visibleCount > 5">
            <ion-icon name="remove-circle-outline"></ion-icon>
            Réduire le nombre de sessions
          </button>
        </div>
      </section>
    </div>
  </div>
</ion-content>

<app-menu [active]="'dashboard'"></app-menu>
