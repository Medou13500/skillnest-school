<ion-content [fullscreen]="true" class="suppression-content">
  <div class="page-wrap">
    <section class="hero">
      <div class="hero-icon">
        <ion-icon name="alert-circle-outline"></ion-icon>
      </div>
      <h1>Veux-tu vraiment supprimer ton compte ?</h1>
      <p>
        Attention, cette action est <span>definitive</span> et <span>irreversible</span>.
        Toutes tes donnees seront supprimees.
      </p>
    </section>

    <section class="details">
      <h2>CE QUI SERA SUPPRIME</h2>

      <div class="items">
        <div class="item" *ngFor="let item of deletedItems">
          <ion-icon name="checkmark-circle"></ion-icon>
          <span>{{ item }}</span>
        </div>
      </div>

      <div class="actions">
        <ion-button expand="block" class="cancel-btn" fill="solid" (click)="goBackToAccount()">
          <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
          Annuler
        </ion-button>

        <ion-button expand="block" class="delete-btn" fill="solid">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Supprimer definitivement le compte
        </ion-button>
      </div>
    </section>
  </div>
</ion-content>
